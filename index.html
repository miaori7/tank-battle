<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 Tank Battle</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #141925;
    --border: #2a3550;
    --text: #e8ecf4;
    --muted: #8b96ad;
    --accent: #f5c542;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 20%, #1a2133 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    -webkit-user-select: none;
    user-select: none;
  }
  .app {
    display: flex;
    gap: 20px;
    align-items: stretch;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stage {
    position: relative;
    background: #000;
    border: 2px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,.55);
    overflow: hidden;
  }
  canvas { display: block; }
  .hud {
    width: 220px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .card h2 {
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .stat {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    padding: 6px 0;
    border-bottom: 1px dashed rgba(255,255,255,.08);
  }
  .stat:last-child { border-bottom: none; }
  .stat .label { color: var(--muted); }
  .stat .value { font-weight: 700; font-variant-numeric: tabular-nums; }
  .lives { display: flex; gap: 6px; }
  .life {
    width: 18px; height: 18px;
    background: #e6b422;
    clip-path: polygon(50% 0, 100% 30%, 80% 100%, 20% 100%, 0 30%);
  }
  .life.lost { background: #33384a; }
  .enemies { display: flex; gap: 5px; flex-wrap: wrap; }
  .dot { width: 14px; height: 14px; border-radius: 3px; }
  .controls { font-size: 13px; color: var(--muted); line-height: 2; }
  .controls b { color: var(--text); background: #232a3c; padding: 1px 7px; border-radius: 4px; font-weight: 600; }
  .tip { font-size: 12px; color: #5f6b82; text-align: center; }
  .btn {
    background: var(--accent);
    color: #14100a;
    border: none;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1px;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: transform .06s ease, filter .15s ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(.97); }
</style>
</head>
<body>
  <div class="app">
    <div class="stage">
      <canvas id="game"></canvas>
    </div>
    <div class="hud">
      <div class="card">
        <h2>坦克大战</h2>
        <div class="stat"><span class="label">得分</span><span class="value" id="score">0</span></div>
        <div class="stat"><span class="label">关卡</span><span class="value" id="level">1</span></div>
        <div class="stat"><span class="label">生命</span><span class="lives" id="lives"></span></div>
        <div class="stat"><span class="label">剩余敌人</span><span class="value" id="enemiesLeft">0</span></div>
      </div>
      <div class="card">
        <h2>操作</h2>
        <div class="controls">
          <b>W A S D</b> / <b>方向键</b> 移动<br>
          <b>空格</b> / <b>J</b> 射击<br>
          <b>P</b> 暂停 &nbsp; <b>M</b> 静音
        </div>
      </div>
      <button class="btn" id="restart">重新开始</button>
      <div class="tip">守住基地，消灭所有敌人</div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // ---------- 常量 ----------
  const COLS = 13, ROWS = 13;
  const TILE = 48;
  const W = COLS * TILE, H = ROWS * TILE;

  const canvas = document.getElementById("game");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");

  // 地图元素
  const EMPTY = 0, BRICK = 1, STEEL = 2, WATER = 3, GRASS = 4, BASE = 5;

  // 方向
  const UP = 0, RIGHT = 1, DOWN = 2, LEFT = 3;
  const DX = [0, 1, 0, -1];
  const DY = [-1, 0, 1, 0];

  // 敌人类型
  const ENEMY_TYPES = [
    { name: "基础", hp: 1, speed: 1.1, points: 100, color: "#8f9bb0" },
    { name: "快速", hp: 1, speed: 2.0, points: 200, color: "#5ec4a8" },
    { name: "火力", hp: 2, speed: 1.3, points: 300, color: "#e6a23c", drops: true },
    { name: "装甲", hp: 3, speed: 1.0, points: 400, color: "#b0b7c6" },
  ];

  const ENEMIES_PER_LEVEL = 20;
  const MAX_ENEMIES_ON_SCREEN = 4;
  const START_LIVES = 3;
  const TANK_SIZE = 40;
  const BULLET_SIZE = 8;

  // ---------- 状态 ----------
  let map = [];
  let player = null;
  let enemies = [];
  let bullets = [];
  let particles = [];
  let powerups = [];
  let score = 0;
  let lives = START_LIVES;
  let level = 1;
  let enemiesToSpawn = ENEMIES_PER_LEVEL;
  let spawnTimer = 0;
  let paused = false;
  let over = false;
  let won = false;
  let shake = 0;
  let gameTime = 0;

  // 玩家强化
  let playerPower = 0;         // 0..3
  let playerShieldUntil = 0;   // 护盾结束时间戳
  let baseWallTimer = 0;       // 铁铲加固剩余时间

  // 输入
  const keys = new Set();
  const keyToDir = {
    ArrowUp: UP, KeyW: UP,
    ArrowRight: RIGHT, KeyD: RIGHT,
    ArrowDown: DOWN, KeyS: DOWN,
    ArrowLeft: LEFT, KeyA: LEFT,
  };

  // ---------- 音频 ----------
  let audioCtx = null;
  let muted = false;
  function audio() {
    if (muted) return null;
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { return null; }
    }
    return audioCtx;
  }
  function beep(freq, dur = 0.06, type = "square", vol = 0.04) {
    const ac = audio();
    if (!ac) return;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g).connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + dur);
  }
  const sfx = {
    shoot: () => beep(720, 0.05, "square", 0.03),
    hit: () => beep(180, 0.06, "sawtooth", 0.05),
    boom: () => beep(90, 0.25, "sawtooth", 0.07),
    powerup: () => beep(980, 0.12, "triangle", 0.05),
  };

  // ---------- 地图 ----------
  function buildMap(lv) {
    const m = Array.from({ length: ROWS }, () => Array(COLS).fill(EMPTY));
    // 基地（底部中央）
    m[ROWS - 1][6] = BASE;
    m[ROWS - 1][7] = BASE;
    // 基地周围砖墙
    const b = (r, c) => { if (m[r] && m[r][c] === EMPTY) m[r][c] = BRICK; };
    b(ROWS - 2, 6); b(ROWS - 2, 7);
    b(ROWS - 1, 5); b(ROWS - 1, 8);
    b(ROWS - 3, 5); b(ROWS - 3, 6); b(ROWS - 3, 7); b(ROWS - 3, 8);

    // 砖块掩体
    const bricks = [
      [1,1],[1,2],[1,9],[1,10],
      [2,4],[2,5],[2,6],[2,7],[2,8],
      [3,1],[3,2],[3,11],[3,12],
      [4,5],[4,7],[4,4],[4,8],
      [5,3],[5,9],
      [6,1],[6,6],[6,8],[6,12],
      [7,2],[7,10],
      [8,4],[8,5],[8,7],[8,8],
      [9,1],[9,2],[9,3],[9,4],[9,8],[9,9],[9,10],[9,11],
      [11,1],[11,2],[11,10],[11,11],
    ];
    bricks.forEach(([r, c]) => { if (r >= 0 && r < ROWS && c >= 0 && c < COLS && m[r][c] === EMPTY) m[r][c] = BRICK; });

    // 钢板
    const steels = [
      [1,3],[1,8],
      [3,6],[3,7],
      [5,5],[5,6],[5,7],
      [7,3],[7,4],[7,8],[7,9],
      [9,5],[9,6],[9,7],
      [11,3],[11,4],[11,8],[11,9],
    ];
    steels.forEach(([r, c]) => { if (r >= 0 && r < ROWS && c >= 0 && c < COLS && m[r][c] === EMPTY) m[r][c] = STEEL; });

    // 水（阻挡坦克，子弹可穿过）
    const waters = [
      [2,0],[2,11],
      [4,1],[4,11],
      [6,4],[6,9],
      [8,1],[8,11],
      [10,5],[10,6],[10,7],
    ];
    waters.forEach(([r, c]) => { if (r >= 0 && r < ROWS && c >= 0 && c < COLS && m[r][c] === EMPTY) m[r][c] = WATER; });

    // 草丛（仅视觉遮挡）
    const grasses = [
      [0,5],[0,6],[0,7],
      [5,0],[5,1],[5,11],[5,12],
      [7,0],[7,12],
      [10,1],[10,2],[10,10],[10,11],
      [12,3],[12,4],[12,8],[12,9],
    ];
    grasses.forEach(([r, c]) => { if (r >= 0 && r < ROWS && c >= 0 && c < COLS && m[r][c] === EMPTY) m[r][c] = GRASS; });

    // 保证出生点为空
    [[0,4],[0,5],[0,6],[0,7],[0,8],[12,6],[12,7]].forEach(([r, c]) => { m[r][c] = EMPTY; });

    return m;
  }

  function isSolidForTank(col, row) {
    if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return true;
    const t = map[row][col];
    return t === BRICK || t === STEEL || t === WATER || t === BASE;
  }
  function isSolidForBullet(col, row) {
    if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return true;
    const t = map[row][col];
    return t === BRICK || t === STEEL || t === BASE;
  }

  function rectHitsMap(x, y, size, fn) {
    const c0 = Math.floor(x / TILE), r0 = Math.floor(y / TILE);
    const c1 = Math.floor((x + size - 1) / TILE), r1 = Math.floor((y + size - 1) / TILE);
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        if (fn(c, r)) return { col: c, row: r };
      }
    }
    return null;
  }

  // ---------- 实体 ----------
  function makeTank(x, y, dir, isPlayer, type) {
    return {
      x, y, dir,
      size: TANK_SIZE,
      speed: isPlayer ? 2.2 : type.speed,
      isPlayer,
      type,
      hp: isPlayer ? 1 : type.hp,
      color: isPlayer ? "#e6b422" : type.color,
      shootCooldown: 0,
      moveTimer: 0,
      spawnProtect: isPlayer ? 3 : 0.5,
    };
  }

  function makeBullet(x, y, dir, isPlayer, power) {
    return { x, y, dir, size: BULLET_SIZE, isPlayer, power, speed: isPlayer ? 4 + power : 3 };
  }

  function spawnPlayer() {
    player = makeTank(6 * TILE + (TILE - TANK_SIZE) / 2, (ROWS - 1) * TILE + (TILE - TANK_SIZE) / 2, UP, true, null);
    playerPower = 0;
    playerShieldUntil = gameTime + 3;
  }

  function spawnEnemy() {
    const spots = [4, 6, 8].map(c => c * TILE + (TILE - TANK_SIZE) / 2);
    const free = spots.filter(x => !enemies.some(e => Math.abs(e.x - x) < TANK_SIZE && e.y < TILE * 2));
    if (!free.length) return false;
    const x = free[(Math.random() * free.length) | 0];
    const y = 0;
    // 根据关卡提高强力敌人比例
    let idx = 0;
    const r = Math.random();
    const strong = Math.min(level * 0.15, 0.6);
    if (r > 1 - strong) idx = 3;
    else if (r > 1 - strong - 0.25) idx = 2;
    else if (r < 0.3) idx = 1;
    enemies.push(makeTank(x, y, DOWN, false, ENEMY_TYPES[idx]));
    return true;
  }

  // ---------- 碰撞检测 ----------
  function rectsOverlap(a, b) {
    return a.x < b.x + b.size && a.x + a.size > b.x &&
           a.y < b.y + b.size && a.y + a.size > b.y;
  }

  function tankBlocked(tank, nx, ny) {
    // 边界
    if (nx < 0 || ny < 0 || nx + tank.size > W || ny + tank.size > H) return true;
    // 地图
    if (rectHitsMap(nx, ny, tank.size, isSolidForTank)) return true;
    // 其他坦克
    const others = tank.isPlayer ? enemies : [player, ...enemies];
    for (const o of others) {
      if (!o || o === tank) continue;
      if (rectsOverlap({ x: nx, y: ny, size: tank.size }, { x: o.x, y: o.y, size: o.size })) return true;
    }
    return false;
  }

  function moveTank(tank, dir) {
    if (tank.dir !== dir) {
      // 尝试转向：若能转动则转
      tank.dir = dir;
      return true;
    }
    const nx = tank.x + DX[dir] * tank.speed;
    const ny = tank.y + DY[dir] * tank.speed;
    if (!tankBlocked(tank, nx, ny)) {
      tank.x = nx;
      tank.y = ny;
      return true;
    }
    // 贴墙对齐
    snapTank(tank);
    return false;
  }

  function snapTank(tank) {
    const m = TILE - tank.size;
    const col = Math.round(tank.x / TILE), row = Math.round(tank.y / TILE);
    const cx = col * TILE + m / 2, cy = row * TILE + m / 2;
    if (tank.dir === UP || tank.dir === DOWN) {
      if (Math.abs(tank.x - cx) < TILE / 2) tank.x = cx;
    } else {
      if (Math.abs(tank.y - cy) < TILE / 2) tank.y = cy;
    }
  }

  function fire(tank) {
    if (tank.shootCooldown > 0) return;
    tank.shootCooldown = tank.isPlayer ? 0.28 : 0.9 + Math.random() * 1.2;
    const m = (TANK_SIZE - BULLET_SIZE) / 2;
    const bx = tank.x + m + (DX[tank.dir] * (tank.size / 2 - 2));
    const by = tank.y + m + (DY[tank.dir] * (tank.size / 2 - 2));
    bullets.push(makeBullet(bx, by, tank.dir, tank.isPlayer, tank.isPlayer ? playerPower : 0));
    sfx.shoot();
  }

  function explode(x, y, big = false) {
    sfx.boom();
    const n = big ? 26 : 14;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 3.2;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.35 + Math.random() * 0.4,
        maxLife: 0.7,
        color: big ? ["#ff8c3a", "#ffd24a", "#ff5a3c"][(Math.random() * 3) | 0] : "#ffb03a",
        size: big ? 4 + Math.random() * 5 : 2 + Math.random() * 3,
      });
    }
    shake = Math.max(shake, big ? 6 : 3);
  }

  // ---------- 子弹逻辑 ----------
  function updateBullets(dt) {
    for (const b of bullets) {
      b.x += DX[b.dir] * b.speed;
      b.y += DY[b.dir] * b.speed;

      // 出界
      if (b.x < 0 || b.y < 0 || b.x + b.size > W || b.y + b.size > H) {
        b.dead = true;
        explode(b.x + b.size / 2, b.y + b.size / 2);
        continue;
      }

      // 打中地图
      const hit = rectHitsMap(b.x, b.y, b.size, isSolidForBullet);
      if (hit) {
        const t = map[hit.row][hit.col];
        b.dead = true;
        if (t === BRICK) {
          map[hit.row][hit.col] = EMPTY;
          explode(hit.col * TILE + TILE / 2, hit.row * TILE + TILE / 2);
          sfx.hit();
        } else if (t === STEEL) {
          if (b.power >= 2) { map[hit.row][hit.col] = EMPTY; explode(hit.col * TILE + TILE / 2, hit.row * TILE + TILE / 2); }
          else { explode(b.x, b.y); sfx.hit(); }
        } else if (t === BASE) {
          destroyBase();
        }
        continue;
      }

      // 打中坦克
      if (b.isPlayer) {
        for (const e of enemies) {
          if (rectsOverlap(b, e)) {
            b.dead = true;
            hitEnemy(e);
            break;
          }
        }
      } else {
        if (player && !player.dead && rectsOverlap(b, player)) {
          b.dead = true;
          if (gameTime > playerShieldUntil) {
            killPlayer();
          }
        }
      }

      // 子弹互撞
      if (!b.dead && b.isPlayer) {
        for (const ob of bullets) {
          if (ob !== b && !ob.isPlayer && !ob.dead && rectsOverlap(b, ob)) {
            b.dead = true; ob.dead = true;
            explode(b.x, b.y);
            break;
          }
        }
      }
    }
    bullets = bullets.filter(b => !b.dead);
  }

  function hitEnemy(e) {
    e.hp--;
    if (e.hp <= 0) {
      e.dead = true;
      score += e.type.points;
      explode(e.x + e.size / 2, e.y + e.size / 2, true);
      if (e.type.drops) {
        dropPowerup(e.x + e.size / 2, e.y + e.size / 2);
      }
    } else {
      explode(e.x + e.size / 2, e.y + e.size / 2);
      sfx.hit();
    }
  }

  function killPlayer() {
    if (player.dead) return;
    player.dead = true;
    explode(player.x + player.size / 2, player.y + player.size / 2, true);
    lives--;
    playerPower = 0;
    if (lives <= 0) {
      over = true;
    } else {
      setTimeout(spawnPlayer, 900);
    }
  }

  function destroyBase() {
    map[ROWS - 1][6] = EMPTY;
    map[ROWS - 1][7] = EMPTY;
    explode(6 * TILE + TILE, (ROWS - 1) * TILE + TILE, true);
    shake = 12;
    over = true;
  }

  function dropPowerup(x, y) {
    const kinds = ["shield", "star", "bomb", "life", "shovel", "freeze"];
    const kind = kinds[(Math.random() * kinds.length) | 0];
    powerups.push({
      x: Math.floor(x / TILE) * TILE + 8,
      y: Math.floor(y / TILE) * TILE + 8,
      size: 32, kind,
    });
  }

  // ---------- 强化道具 ----------
  function applyPowerup(kind) {
    sfx.powerup();
    switch (kind) {
      case "shield": playerShieldUntil = gameTime + 10; break;
      case "star": playerPower = Math.min(3, playerPower + 1); break;
      case "bomb":
        enemies.forEach(e => { e.dead = true; score += e.type.points; explode(e.x + 20, e.y + 20, true); });
        enemies = enemies.filter(e => !e.dead);
        break;
      case "life": lives = Math.min(9, lives + 1); break;
      case "shovel":
        baseWallTimer = gameTime + 15;
        [[ROWS-2,6],[ROWS-2,7],[ROWS-1,5],[ROWS-1,8],[ROWS-3,5],[ROWS-3,6],[ROWS-3,7],[ROWS-3,8]]
          .forEach(([r,c]) => { if (map[r][c] === BRICK) map[r][c] = STEEL; });
        break;
      case "freeze":
        enemies.forEach(e => { e.frozenUntil = gameTime + 6; });
        break;
    }
  }

  function updatePowerups() {
    for (const p of powerups) {
      if (player && !player.dead && rectsOverlap(p, { x: player.x, y: player.y, size: player.size })) {
        p.dead = true;
        applyPowerup(p.kind);
      }
    }
    powerups = powerups.filter(p => !p.dead);
  }

  // ---------- 敌人 AI ----------
  function updateEnemies(dt) {
    for (const e of enemies) {
      if (e.dead) continue;
      if (e.frozenUntil && gameTime < e.frozenUntil) continue;

      if (e.spawnProtect > 0) e.spawnProtect -= dt;

      e.shootCooldown -= dt;
      e.moveTimer -= dt;

      if (e.moveTimer <= 0) {
        e.moveTimer = 0.5 + Math.random() * 1.5;
        // 一定概率朝下（进攻基地）
        const r = Math.random();
        if (r < 0.35) e.dir = DOWN;
        else if (r < 0.5) {
          const c = player ? (player.x + 20 - (e.x + 20)) : 0;
          const rr = player ? (player.y + 20 - (e.y + 20)) : 0;
          e.dir = Math.abs(c) > Math.abs(rr) ? (c > 0 ? RIGHT : LEFT) : (rr > 0 ? DOWN : UP);
        } else {
          e.dir = (Math.random() * 4) | 0;
        }
      }

      if (!moveTank(e, e.dir)) {
        e.moveTimer = 0;
      }

      // 射击
      if (e.shootCooldown <= 0) {
        const alignedWithBase = Math.abs(e.x - (6 * TILE + 4)) < TILE * 1.2 || Math.abs(e.x - (7 * TILE - 4)) < TILE * 1.2;
        if (alignedWithBase || Math.random() < 0.15) {
          if (alignedWithBase) {
            e.dir = (e.y + e.size < (ROWS - 2) * TILE) ? DOWN : UP;
          }
          fire(e);
        }
      }
    }
    enemies = enemies.filter(e => !e.dead);
  }

  function updateSpawns(dt) {
    if (enemiesToSpawn > 0 && enemies.length < MAX_ENEMIES_ON_SCREEN) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        if (spawnEnemy()) {
          enemiesToSpawn--;
          spawnTimer = 0.6;
        } else {
          spawnTimer = 0.2;
        }
      }
    }
    if (enemiesToSpawn <= 0 && enemies.length === 0 && !over) {
      won = true;
    }
  }

  // ---------- 玩家 ----------
  function updatePlayer(dt) {
    if (!player || player.dead) return;
    player.shootCooldown -= dt;
    player.spawnProtect = Math.max(0, player.spawnProtect - dt);

    let dir = -1;
    if (keys.has("ArrowUp") || keys.has("KeyW")) dir = UP;
    else if (keys.has("ArrowDown") || keys.has("KeyS")) dir = DOWN;
    else if (keys.has("ArrowLeft") || keys.has("KeyA")) dir = LEFT;
    else if (keys.has("ArrowRight") || keys.has("KeyD")) dir = RIGHT;

    if (dir >= 0) moveTank(player, dir);
    if (keys.has("Space") || keys.has("KeyJ")) fire(player);
  }

  // ---------- 粒子 ----------
  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  // ---------- 主循环 ----------
  let last = 0;
  function loop(ts) {
    const dt = Math.min(0.05, (ts - last) / 1000 || 0);
    last = ts;
    gameTime += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 20);

    if (!paused && !over && !won) {
      updatePlayer(dt);
      updateEnemies(dt);
      updateBullets(dt);
      updatePowerups();
      updateSpawns(dt);
      updateParticles(dt);

      // 基地墙加固恢复
      if (baseWallTimer && gameTime > baseWallTimer) {
        baseWallTimer = 0;
        [[ROWS-2,6],[ROWS-2,7],[ROWS-1,5],[ROWS-1,8],[ROWS-3,5],[ROWS-3,6],[ROWS-3,7],[ROWS-3,8]]
          .forEach(([r,c]) => { if (map[r][c] === STEEL) map[r][c] = BRICK; });
      }
    }

    render();
    updateHUD();
    requestAnimationFrame(loop);
  }

  // ---------- 渲染 ----------
  function render() {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    // 背景
    ctx.fillStyle = "#11151f";
    ctx.fillRect(0, 0, W, H);

    // 网格地砖
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = map[r][c];
        const x = c * TILE, y = r * TILE;
        if (t === EMPTY) {
          ctx.fillStyle = (r + c) % 2 ? "#181d29" : "#141926";
          ctx.fillRect(x, y, TILE, TILE);
        } else if (t === BRICK) {
          drawBrick(x, y);
        } else if (t === STEEL) {
          drawSteel(x, y);
        } else if (t === WATER) {
          drawWater(x, y);
        } else if (t === BASE) {
          drawBaseTile(x, y);
        }
      }
    }

    // 草丛（最后画，覆盖坦克，半透明）
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (map[r][c] === GRASS) drawGrass(c * TILE, r * TILE);
      }
    }

    // 道具
    for (const p of powerups) drawPowerup(p);

    // 坦克
    if (player && !player.dead) drawTank(player);
    for (const e of enemies) if (!e.dead) drawTank(e);

    // 子弹
    for (const b of bullets) {
      ctx.fillStyle = b.isPlayer ? "#fff" : "#ffd24a";
      ctx.fillRect(b.x, b.y, b.size, b.size);
    }

    // 粒子
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    // 覆盖层
    if (paused && !over && !won) overlay("已暂停", "按 P 继续", "#f5c542");
    if (over) overlay("游戏结束", "基地被摧毁 / 生命耗尽", "#ff5a5a");
    if (won) overlay("胜利！", "所有敌人已被消灭", "#5ec46a");
  }

  function overlay(title, sub, color) {
    ctx.fillStyle = "rgba(6,8,14,0.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = color;
    ctx.font = "700 42px 'Segoe UI', 'Microsoft YaHei', sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 12);
    ctx.fillStyle = "#cbd3e2";
    ctx.font = "18px 'Segoe UI', 'Microsoft YaHei', sans-serif";
    ctx.fillText(sub, W / 2, H / 2 + 28);
  }

  function drawBrick(x, y) {
    ctx.fillStyle = "#a34a2a";
    ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = "#2c1208";
    ctx.lineWidth = 1.5;
    // 砖缝
    const half = TILE / 2;
    for (let row = 0; row < 2; row++) {
      const yy = y + row * half;
      for (let i = 0; i < 2; i++) {
        const xx = x + i * half + (row % 2 ? half / 2 : 0);
        if (xx < x + TILE) {
          ctx.strokeRect(xx, yy, half, half);
        }
      }
    }
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.strokeRect(x, y, TILE, TILE);
  }

  function drawSteel(x, y) {
    ctx.fillStyle = "#6f7a8c";
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = "#aeb8c8";
    ctx.fillRect(x + 3, y + 3, TILE - 6, TILE - 6);
    ctx.fillStyle = "#5a6575";
    ctx.fillRect(x + TILE / 2 - 2, y + 3, 4, TILE - 6);
    ctx.fillRect(x + 3, y + TILE / 2 - 2, TILE - 6, 4);
    ctx.strokeStyle = "#232a36";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x, y, TILE, TILE);
  }

  function drawWater(x, y) {
    const wave = Math.sin(gameTime * 3 + x * 0.1 + y * 0.1) * 2;
    ctx.fillStyle = "#1e4d7a";
    ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = "#3f7db8";
    ctx.lineWidth = 2;
    for (let i = 1; i < 3; i++) {
      ctx.beginPath();
      const yy = y + i * (TILE / 3) + wave;
      ctx.moveTo(x + 2, yy);
      ctx.quadraticCurveTo(x + TILE / 4, yy - 3, x + TILE / 2, yy);
      ctx.quadraticCurveTo(x + 3 * TILE / 4, yy + 3, x + TILE - 2, yy);
      ctx.stroke();
    }
  }

  function drawBaseTile(x, y) {
    // 基地底座
    ctx.fillStyle = "#1a1f2b";
    ctx.fillRect(x, y, TILE, TILE);
    // 鹰图标
    ctx.fillStyle = "#e8ecf4";
    ctx.beginPath();
    ctx.moveTo(x + TILE / 2, y + 8);
    ctx.lineTo(x + TILE - 8, y + TILE - 8);
    ctx.lineTo(x + TILE - 12, y + TILE - 8);
    ctx.lineTo(x + TILE - 8, y + TILE - 14);
    ctx.lineTo(x + TILE / 2 + 3, y + TILE / 2 - 4);
    ctx.lineTo(x + 8, y + TILE - 14);
    ctx.lineTo(x + 12, y + TILE - 8);
    ctx.lineTo(x + 8, y + TILE - 8);
    ctx.closePath();
    ctx.fill();
    // 基地文字
    ctx.fillStyle = "#8b96ad";
    ctx.font = "9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("基地", x + TILE / 2, y + TILE - 3);
  }

  function drawGrass(x, y) {
    ctx.fillStyle = "rgba(60,120,70,0.62)";
    ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = "rgba(90,160,95,0.5)";
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const gx = x + 6 + i * 11;
      ctx.beginPath();
      ctx.moveTo(gx, y + TILE - 4);
      ctx.lineTo(gx + 2, y + TILE - 14);
      ctx.moveTo(gx + 4, y + TILE - 4);
      ctx.lineTo(gx + 5, y + TILE - 12);
      ctx.stroke();
    }
  }

  function drawTank(t) {
    ctx.save();
    ctx.translate(t.x + t.size / 2, t.y + t.size / 2);
    ctx.rotate(t.dir * Math.PI / 2);

    // 护盾光环
    if ((t.isPlayer && gameTime < playerShieldUntil) || t.spawnProtect > 0) {
      ctx.strokeStyle = t.spawnProtect > 0 && !t.isPlayer ? "rgba(255,255,255,0.5)" : "rgba(140,220,255,0.75)";
      ctx.lineWidth = 3;
      const blink = t.spawnProtect > 0 && Math.floor(t.spawnProtect * 6) % 2 === 0;
      if (!blink) ctx.strokeRect(-t.size / 2 - 3, -t.size / 2 - 3, t.size + 6, t.size + 6);
    }

    const s = t.size;
    // 履带
    ctx.fillStyle = "#2b2f38";
    ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.fillStyle = "#3a404c";
    for (let i = 0; i < 4; i++) {
      const o = -s / 2 + 5 + i * 9;
      ctx.fillRect(o, -s / 2 + 2, 4, s - 4);
    }
    // 车身
    ctx.fillStyle = t.color;
    ctx.fillRect(-s / 2 + 6, -s / 2 + 6, s - 12, s - 12);
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.fillRect(-s / 2 + 6, -s / 2 + 6, s - 12, 5);
    // 炮管
    ctx.fillStyle = "#22262e";
    ctx.fillRect(-3, -s / 2 - 8, 6, s / 2 - 2);
    // 炮塔
    ctx.fillStyle = t.isPlayer ? "#f7d94c" : shade(t.color, -12);
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.22, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) + amt, g = ((n >> 8) & 0xff) + amt, b = (n & 0xff) + amt;
    r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
    return `rgb(${r},${g},${b})`;
  }

  function drawPowerup(p) {
    const c = {
      shield: "#4fc3f7", star: "#f5c542", bomb: "#ff6b6b",
      life: "#5ec46a", shovel: "#c9a15a", freeze: "#b39ddb",
    }[p.kind];
    ctx.save();
    ctx.translate(p.x + p.size / 2, p.y + p.size / 2);
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fillRect(-p.size / 2 - 2, -p.size / 2 - 2, p.size + 4, p.size + 4);
    ctx.fillStyle = c;
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const sym = { shield: "盾", star: "★", bomb: "炸", life: "命", shovel: "铲", freeze: "冰" }[p.kind];
    ctx.fillText(sym, 0, 1);
    ctx.restore();
    ctx.textBaseline = "alphabetic";
  }

  // ---------- HUD ----------
  function updateHUD() {
    document.getElementById("score").textContent = score;
    document.getElementById("level").textContent = level;
    document.getElementById("enemiesLeft").textContent = enemiesToSpawn + enemies.length;

    const livesEl = document.getElementById("lives");
    livesEl.innerHTML = "";
    for (let i = 0; i < Math.min(6, lives); i++) {
      const d = document.createElement("div");
      d.className = "life";
      livesEl.appendChild(d);
    }
  }

  // ---------- 输入 ----------
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") e.preventDefault();
    if (e.code === "KeyP" && !e.repeat) { if (!over && !won) paused = !paused; return; }
    if (e.code === "KeyM" && !e.repeat) { muted = !muted; return; }
    keys.add(e.code);
  });
  window.addEventListener("keyup", (e) => keys.delete(e.code));
  window.addEventListener("blur", () => keys.clear());

  // 触屏按钮（简单虚拟摇杆）
  const touch = { dir: -1, fire: false };
  function bindTouch(id, dir, fire) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("touchstart", (e) => { e.preventDefault(); if (fire) touch.fire = true; else touch.dir = dir; });
    el.addEventListener("touchend", (e) => { e.preventDefault(); if (fire) touch.fire = false; else if (touch.dir === dir) touch.dir = -1; });
  }

  // ---------- 游戏流程 ----------
  function startGame(lv = 1) {
    level = lv;
    map = buildMap(lv);
    score = 0;
    lives = START_LIVES;
    enemies = [];
    bullets = [];
    particles = [];
    powerups = [];
    enemiesToSpawn = ENEMIES_PER_LEVEL;
    spawnTimer = 0.5;
    over = false;
    won = false;
    paused = false;
    baseWallTimer = 0;
    gameTime = 0;
    spawnPlayer();
  }

  function nextLevel() {
    startGame(level + 1);
  }

  document.getElementById("restart").addEventListener("click", () => startGame(1));

  // 键盘重启 / 下一关
  window.addEventListener("keydown", (e) => {
    if ((e.code === "Enter" || e.code === "KeyR") && (over || won)) {
      if (won) nextLevel(); else startGame(1);
    }
  });

  // ---------- 启动 ----------
  startGame(1);
  requestAnimationFrame((ts) => { last = ts; loop(ts); });
})();
</script>
</body>
</html>
