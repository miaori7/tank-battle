<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 Tank Battle</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #141925;
    --border: #2a3550;
    --text: #e8ecf4;
    --muted: #8b96ad;
    --accent: #f5c542;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 20%, #1a2133 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    -webkit-user-select: none;
    user-select: none;
  }
  .app {
    display: flex;
    gap: 20px;
    align-items: stretch;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stage {
    position: relative;
    background: #000;
    border: 2px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,.55);
    overflow: hidden;
  }
  canvas { display: block; }
  .hud {
    width: 220px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .card h2 {
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .stat {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    padding: 6px 0;
    border-bottom: 1px dashed rgba(255,255,255,.08);
  }
  .stat:last-child { border-bottom: none; }
  .stat .label { color: var(--muted); }
  .stat .value { font-weight: 700; font-variant-numeric: tabular-nums; }
  .lives { display: flex; gap: 6px; }
  .life {
    width: 18px; height: 18px;
    background: #e6b422;
    clip-path: polygon(50% 0, 100% 30%, 80% 100%, 20% 100%, 0 30%);
  }
  .life.lost { background: #33384a; }
  .enemies { display: flex; gap: 5px; flex-wrap: wrap; }
  .dot { width: 14px; height: 14px; border-radius: 3px; }
  .controls { font-size: 13px; color: var(--muted); line-height: 2; }
  .controls b { color: var(--text); background: #232a3c; padding: 1px 7px; border-radius: 4px; font-weight: 600; }
  .tip { font-size: 12px; color: #5f6b82; text-align: center; }
  .btn {
    background: var(--accent);
    color: #14100a;
    border: none;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1px;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: transform .06s ease, filter .15s ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(.97); }
  .btn.secondary { background: #2a3550; color: var(--text); }
  .choice-overlay {
    position: absolute;
    inset: 0;
    background: rgba(6,8,14,0.82);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .choice-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px 28px;
    text-align: center;
    width: 300px;
  }
  .choice-box h2 { color: var(--accent); margin-bottom: 8px; }
  .choice-box p { color: var(--muted); font-size: 13px; margin-bottom: 18px; line-height: 1.7; }
  .choice-box .btn { width: 100%; margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="app">
    <div class="stage">
      <canvas id="game"></canvas>
      <div class="choice-overlay" id="choicePanel" style="display:none;">
        <div class="choice-box">
          <h2>🏆 通关！</h2>
          <p id="choiceStats"></p>
          <button class="btn" id="btnInfinite">进入无限模式</button>
          <button class="btn secondary" id="btnRestart">回到最初状态</button>
        </div>
      </div>
    </div>
    <div class="hud">
      <div class="card">
        <h2>坦克大战</h2>
        <div class="stat"><span class="label">得分</span><span class="value" id="score">0</span></div>
        <div class="stat"><span class="label">关卡</span><span class="value" id="level">1</span></div>
        <div class="stat"><span class="label">生命</span><span class="lives" id="lives"></span></div>
        <div class="stat"><span class="label">剩余敌人</span><span class="value" id="enemiesLeft">0</span></div>
      </div>
      <div class="card">
        <h2>通关记录</h2>
        <div class="stat"><span class="label">通关次数</span><span class="value" id="clearCount">0</span></div>
        <div class="stat"><span class="label">最短通关时长</span><span class="value" id="bestTime">--</span></div>
      </div>
      <div class="card">
        <h2>操作</h2>
        <div class="controls">
          <b>W A S D</b> / <b>方向键</b> / <b>左摇杆</b> 移动<br>
          <b>空格</b> / <b>J</b> / <b>A键</b> 射击<br>
          <b>P</b> / <b>Start</b> 暂停 &nbsp; <b>M</b> 静音
        </div>
        <div class="controls" id="padStatus" style="margin-top:8px;">🎮 Xbox 手柄：未连接</div>
      </div>
      <button class="btn" id="restart">重新开始</button>
      <div class="tip">通关 5 关（第 5 关 BOSS）后可选无限模式</div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // ---------- 常量 ----------
  const COLS = 13, ROWS = 13;
  const TILE = 48;
  const W = COLS * TILE, H = ROWS * TILE;

  const canvas = document.getElementById("game");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");

  // 地图元素
  const EMPTY = 0, BRICK = 1, STEEL = 2, WATER = 3, GRASS = 4, BASE = 5;

  // 方向
  const UP = 0, RIGHT = 1, DOWN = 2, LEFT = 3;
  const DX = [0, 1, 0, -1];
  const DY = [-1, 0, 1, 0];

  // 敌人类型
  const ENEMY_TYPES = [
    { name: "基础", hp: 1, speed: 0.9, points: 100, color: "#8f9bb0" },
    { name: "快速", hp: 1, speed: 1.5, points: 200, color: "#5ec4a8" },
    { name: "火力", hp: 2, speed: 1.1, points: 300, color: "#e6a23c", drops: true },
    { name: "装甲", hp: 3, speed: 0.8, points: 400, color: "#b0b7c6" },
  ];

  const ENEMIES_PER_LEVEL = 20;
  const MAX_ENEMIES_ON_SCREEN = 4;
  const START_LIVES = 3;
  const TANK_SIZE = 40;
  const BULLET_SIZE = 8;
  const PLAYER_SPEED = 2.2;
  const PLAYER_FIRE_COOLDOWN = 0.28;
  const ENEMY_BULLET_SPEED = 2.0;
  const BOSS_BULLET_SPEED = 3.5;
  const BOSS_HP = 10;

  // ---------- 状态 ----------
  let map = [];
  let player = null;
  let enemies = [];
  let bullets = [];
  let particles = [];
  let powerups = [];
  let score = 0;
  let lives = START_LIVES;
  let level = 1;
  let enemiesToSpawn = ENEMIES_PER_LEVEL;
  let spawnTimer = 0;
  let paused = false;
  let over = false;
  let won = false;
  let shake = 0;
  let gameTime = 0;

  // 关卡 / 模式 / 统计
  let mode = 'campaign';       // 'campaign' | 'infinite'
  let difficultyLevel = 1;     // 敌人强度等级（无限模式固定为 4）
  let boss = null;             // 第 5 关 Boss
  let campaignClear = false;   // 通关选择界面
  let campaignTime = 0;        // 本次战役累计游戏时长（秒）
  let clearCount = 0;          // 通关次数（localStorage）
  let bestTime = Infinity;     // 最短通关时长（秒，localStorage）

  // 玩家强化
  let playerPower = 0;         // 0..3
  let playerShieldUntil = 0;   // 护盾结束时间戳
  let baseWallTimer = 0;       // 铁铲加固剩余时间

  // 通关统计（localStorage 持久化）
  function loadStats() {
    try {
      clearCount = parseInt(localStorage.getItem('tankClearCount') || '0', 10) || 0;
      const bt = parseFloat(localStorage.getItem('tankBestTime') || '');
      bestTime = (isFinite(bt) && bt > 0) ? bt : Infinity;
    } catch (e) {}
  }
  function saveStats() {
    try {
      localStorage.setItem('tankClearCount', String(clearCount));
      if (isFinite(bestTime)) localStorage.setItem('tankBestTime', String(bestTime));
    } catch (e) {}
  }
  function formatTime(t) {
    const s = Math.round(t);
    const m = Math.floor(s / 60);
    const ss = s % 60;
    return m > 0 ? m + "分" + ss + "秒" : ss + "秒";
  }

  // 输入
  const keys = new Set();

  // 手柄（Xbox / 标准映射）
  let gamepadConnected = false;
  let gamepadIndex = null;
  let gp = null;
  let prevButtons = [];

  window.addEventListener("gamepadconnected", (e) => {
    gamepadConnected = true;
    gamepadIndex = e.gamepad.index;
    prevButtons = e.gamepad.buttons.map(b => b.pressed);
  });
  window.addEventListener("gamepaddisconnected", (e) => {
    if (gamepadIndex === e.gamepad.index) {
      gamepadConnected = false;
      gamepadIndex = null;
      gp = null;
      prevButtons = [];
    }
  });

  function updateGamepad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let pad = null;
    if (gamepadIndex != null) pad = pads[gamepadIndex] || null;
    if (!pad) {
      // 兼容页面加载前就已连接的手柄
      pad = Array.from(pads).find(p => p && p.connected) || null;
      if (pad) { gamepadIndex = pad.index; gamepadConnected = true; }
    }
    if (!pad) { gp = null; return; }
    gp = pad;

    const edge = (i) => {
      const p = !!(pad.buttons[i] && pad.buttons[i].pressed);
      const prev = prevButtons[i] || false;
      prevButtons[i] = p;
      return p && !prev;
    };

    // 通关选择：A(0)/Start(9) 进入无限模式，B(1) 回到最初
    if (campaignClear) {
      if (edge(0) || edge(9)) enterInfiniteMode();
      else if (edge(1)) returnToStart();
      return;
    }
    // 暂停/继续：Start(9)
    if (edge(9) && !over && !won) paused = !paused;
    // 结束/胜利：A(0) 或 Start(9)
    if ((over || won) && (edge(0) || edge(9))) {
      if (won) nextLevel(); else startGame(1);
    }
  }

  function gamepadDir(pad) {
    const dead = 0.4;
    let x = pad.axes[0] || 0;
    let y = pad.axes[1] || 0;
    if (Math.abs(x) < dead) x = 0;
    if (Math.abs(y) < dead) y = 0;
    // 十字键优先
    if (pad.buttons[12] && pad.buttons[12].pressed) y = -1;
    else if (pad.buttons[13] && pad.buttons[13].pressed) y = 1;
    if (pad.buttons[14] && pad.buttons[14].pressed) x = -1;
    else if (pad.buttons[15] && pad.buttons[15].pressed) x = 1;

    if (Math.abs(x) > Math.abs(y)) return x > 0 ? RIGHT : LEFT;
    if (Math.abs(y) > 0) return y > 0 ? DOWN : UP;
    return -1;
  }

  // ---------- 音频 ----------
  let audioCtx = null;
  let muted = false;
  function audio() {
    if (muted) return null;
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { return null; }
    }
    return audioCtx;
  }
  function beep(freq, dur = 0.06, type = "square", vol = 0.04) {
    const ac = audio();
    if (!ac) return;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g).connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + dur);
  }
  const sfx = {
    shoot: () => beep(720, 0.05, "square", 0.03),
    hit: () => beep(180, 0.06, "sawtooth", 0.05),
    boom: () => beep(90, 0.25, "sawtooth", 0.07),
    powerup: () => beep(980, 0.12, "triangle", 0.05),
  };

  // ---------- 地图 ----------
  function buildMap(lv) {
    const m = Array.from({ length: ROWS }, () => Array(COLS).fill(EMPTY));
    // 基地（底部中央）
    m[ROWS - 1][6] = BASE;
    m[ROWS - 1][7] = BASE;
    // 基地周围砖墙
    const b = (r, c) => { if (m[r] && m[r][c] === EMPTY) m[r][c] = BRICK; };
    b(ROWS - 2, 6); b(ROWS - 2, 7);
    b(ROWS - 1, 5); b(ROWS - 1, 8);
    b(ROWS - 3, 5); b(ROWS - 3, 6); b(ROWS - 3, 7); b(ROWS - 3, 8);

    // 砖块掩体
    const bricks = [
      [1,1],[1,2],[1,9],[1,10],
      [2,4],[2,5],[2,6],[2,7],[2,8],
      [3,1],[3,2],[3,11],[3,12],
      [4,5],[4,7],[4,4],[4,8],
      [5,3],[5,9],
      [6,1],[6,6],[6,8],[6,12],
      [7,2],[7,10],
      [8,4],[8,5],[8,7],[8,8],
      [9,1],[9,2],[9,3],[9,4],[9,8],[9,9],[9,10],[9,11],
      [11,1],[11,2],[11,10],[11,11],
    ];
    bricks.forEach(([r, c]) => { if (r >= 0 && r < ROWS && c >= 0 && c < COLS && m[r][c] === EMPTY) m[r][c] = BRICK; });

    // 钢板
    const steels = [
      [1,3],[1,8],
      [3,6],[3,7],
      [5,5],[5,6],[5,7],
      [7,3],[7,4],[7,8],[7,9],
      [9,5],[9,6],[9,7],
      [11,3],[11,4],[11,8],[11,9],
    ];
    steels.forEach(([r, c]) => { if (r >= 0 && r < ROWS && c >= 0 && c < COLS && m[r][c] === EMPTY) m[r][c] = STEEL; });

    // 水（阻挡坦克，子弹可穿过）
    const waters = [
      [2,0],[2,11],
      [4,1],[4,11],
      [6,4],[6,9],
      [8,1],[8,11],
      [10,5],[10,6],[10,7],
    ];
    waters.forEach(([r, c]) => { if (r >= 0 && r < ROWS && c >= 0 && c < COLS && m[r][c] === EMPTY) m[r][c] = WATER; });

    // 草丛（仅视觉遮挡）
    const grasses = [
      [0,5],[0,6],[0,7],
      [5,0],[5,1],[5,11],[5,12],
      [7,0],[7,12],
      [10,1],[10,2],[10,10],[10,11],
      [12,3],[12,4],[12,8],[12,9],
    ];
    grasses.forEach(([r, c]) => { if (r >= 0 && r < ROWS && c >= 0 && c < COLS && m[r][c] === EMPTY) m[r][c] = GRASS; });

    // 保证出生点为空
    [[0,4],[0,5],[0,6],[0,7],[0,8],[12,6],[12,7]].forEach(([r, c]) => { m[r][c] = EMPTY; });

    return m;
  }

  function isSolidForTank(col, row) {
    if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return true;
    const t = map[row][col];
    return t === BRICK || t === STEEL || t === WATER || t === BASE;
  }
  function isSolidForBullet(col, row) {
    if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return true;
    const t = map[row][col];
    return t === BRICK || t === STEEL || t === BASE;
  }

  function rectHitsMap(x, y, size, fn) {
    const c0 = Math.floor(x / TILE), r0 = Math.floor(y / TILE);
    const c1 = Math.floor((x + size - 1) / TILE), r1 = Math.floor((y + size - 1) / TILE);
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        if (fn(c, r)) return { col: c, row: r };
      }
    }
    return null;
  }

  // ---------- 实体 ----------
  function makeTank(x, y, dir, isPlayer, type) {
    return {
      x, y, dir,
      size: TANK_SIZE,
      speed: isPlayer ? PLAYER_SPEED : type.speed,
      isPlayer,
      type,
      hp: isPlayer ? 1 : type.hp,
      color: isPlayer ? "#e6b422" : type.color,
      shootCooldown: 0,
      moveTimer: 0,
      spawnProtect: isPlayer ? 3 : 0.5,
    };
  }

  function makeBullet(x, y, dir, isPlayer, power, speed) {
    const spd = (speed !== undefined) ? speed : (isPlayer ? 4 + power : ENEMY_BULLET_SPEED);
    return { x, y, dir, size: BULLET_SIZE, isPlayer, power, speed: spd };
  }

  function spawnPlayer() {
    player = makeTank(6 * TILE + (TILE - TANK_SIZE) / 2, (ROWS - 1) * TILE + (TILE - TANK_SIZE) / 2, UP, true, null);
    playerPower = 0;
    playerShieldUntil = gameTime + 3;
  }

  function spawnEnemy() {
    const spots = [4, 6, 8].map(c => c * TILE + (TILE - TANK_SIZE) / 2);
    const free = spots.filter(x => !enemies.some(e => Math.abs(e.x - x) < TANK_SIZE && e.y < TILE * 2));
    if (!free.length) return false;
    const x = free[(Math.random() * free.length) | 0];
    const y = 0;
    // 根据关卡提高强力敌人比例
    let idx = 0;
    const r = Math.random();
    const strong = Math.min(difficultyLevel * 0.15, 0.6);
    if (r > 1 - strong) idx = 3;
    else if (r > 1 - strong - 0.25) idx = 2;
    else if (r < 0.3) idx = 1;
    enemies.push(makeTank(x, y, DOWN, false, ENEMY_TYPES[idx]));
    return true;
  }

  // ---------- 碰撞检测 ----------
  function rectsOverlap(a, b) {
    return a.x < b.x + b.size && a.x + a.size > b.x &&
           a.y < b.y + b.size && a.y + a.size > b.y;
  }

  function tankBlocked(tank, nx, ny) {
    // 边界
    if (nx < 0 || ny < 0 || nx + tank.size > W || ny + tank.size > H) return true;
    // 地图
    if (rectHitsMap(nx, ny, tank.size, isSolidForTank)) return true;
    // 其他坦克（含 Boss）
    const test = { x: nx, y: ny, size: tank.size };
    if (tank !== player && player && !player.dead && rectsOverlap(test, player)) return true;
    if (tank !== boss && boss && !boss.dead && rectsOverlap(test, boss)) return true;
    for (const o of enemies) {
      if (o === tank || o.dead) continue;
      if (rectsOverlap(test, o)) return true;
    }
    return false;
  }

  function moveTank(tank, dir) {
    if (tank.dir !== dir) {
      // 尝试转向：若能转动则转
      tank.dir = dir;
      return true;
    }
    const nx = tank.x + DX[dir] * tank.speed;
    const ny = tank.y + DY[dir] * tank.speed;
    if (!tankBlocked(tank, nx, ny)) {
      tank.x = nx;
      tank.y = ny;
      return true;
    }
    // 贴墙对齐
    snapTank(tank);
    return false;
  }

  function snapTank(tank) {
    const m = TILE - tank.size;
    const col = Math.round(tank.x / TILE), row = Math.round(tank.y / TILE);
    const cx = col * TILE + m / 2, cy = row * TILE + m / 2;
    if (tank.dir === UP || tank.dir === DOWN) {
      if (Math.abs(tank.x - cx) < TILE / 2) tank.x = cx;
    } else {
      if (Math.abs(tank.y - cy) < TILE / 2) tank.y = cy;
    }
  }

  function fire(tank) {
    if (tank.shootCooldown > 0) return;
    tank.shootCooldown = tank.isPlayer ? PLAYER_FIRE_COOLDOWN : 0.9 + Math.random() * 1.2;
    const m = (TANK_SIZE - BULLET_SIZE) / 2;
    const bx = tank.x + m + (DX[tank.dir] * (tank.size / 2 - 2));
    const by = tank.y + m + (DY[tank.dir] * (tank.size / 2 - 2));
    bullets.push(makeBullet(bx, by, tank.dir, tank.isPlayer, tank.isPlayer ? playerPower : 0));
    sfx.shoot();
  }

  function explode(x, y, big = false) {
    sfx.boom();
    const n = big ? 26 : 14;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 3.2;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.35 + Math.random() * 0.4,
        maxLife: 0.7,
        color: big ? ["#ff8c3a", "#ffd24a", "#ff5a3c"][(Math.random() * 3) | 0] : "#ffb03a",
        size: big ? 4 + Math.random() * 5 : 2 + Math.random() * 3,
      });
    }
    shake = Math.max(shake, big ? 6 : 3);
  }

  // ---------- 子弹逻辑 ----------
  function updateBullets(dt) {
    for (const b of bullets) {
      b.x += DX[b.dir] * b.speed;
      b.y += DY[b.dir] * b.speed;

      // 出界
      if (b.x < 0 || b.y < 0 || b.x + b.size > W || b.y + b.size > H) {
        b.dead = true;
        explode(b.x + b.size / 2, b.y + b.size / 2);
        continue;
      }

      // 打中地图
      const hit = rectHitsMap(b.x, b.y, b.size, isSolidForBullet);
      if (hit) {
        const t = map[hit.row][hit.col];
        b.dead = true;
        if (t === BRICK) {
          map[hit.row][hit.col] = EMPTY;
          explode(hit.col * TILE + TILE / 2, hit.row * TILE + TILE / 2);
          sfx.hit();
        } else if (t === STEEL) {
          if (b.power >= 2) { map[hit.row][hit.col] = EMPTY; explode(hit.col * TILE + TILE / 2, hit.row * TILE + TILE / 2); }
          else { explode(b.x, b.y); sfx.hit(); }
        } else if (t === BASE) {
          destroyBase();
        }
        continue;
      }

      // 打中坦克
      if (b.isPlayer) {
        if (boss && !boss.dead && rectsOverlap(b, boss)) {
          b.dead = true;
          hitBoss();
        } else {
          for (const e of enemies) {
            if (rectsOverlap(b, e)) {
              b.dead = true;
              hitEnemy(e);
              break;
            }
          }
        }
      } else {
        if (player && !player.dead && rectsOverlap(b, player)) {
          b.dead = true;
          if (gameTime > playerShieldUntil) {
            killPlayer();
          }
        }
      }

      // 子弹互撞
      if (!b.dead && b.isPlayer) {
        for (const ob of bullets) {
          if (ob !== b && !ob.isPlayer && !ob.dead && rectsOverlap(b, ob)) {
            b.dead = true; ob.dead = true;
            explode(b.x, b.y);
            break;
          }
        }
      }
    }
    bullets = bullets.filter(b => !b.dead);
  }

  function hitEnemy(e) {
    e.hp--;
    if (e.hp <= 0) {
      e.dead = true;
      score += e.type.points;
      explode(e.x + e.size / 2, e.y + e.size / 2, true);
      if (e.type.drops) {
        dropPowerup(e.x + e.size / 2, e.y + e.size / 2);
      }
    } else {
      explode(e.x + e.size / 2, e.y + e.size / 2);
      sfx.hit();
    }
  }

  function hitBoss() {
    if (!boss || boss.dead) return;
    boss.hp--;
    if (boss.hp <= 0) {
      boss.dead = true;
      score += 1000;
      explode(boss.x + boss.size / 2, boss.y + boss.size / 2, true);
      shake = 12;
      onCampaignClear();
    } else {
      explode(boss.x + boss.size / 2, boss.y + boss.size / 2);
    }
  }

  function killPlayer() {
    if (player.dead) return;
    player.dead = true;
    explode(player.x + player.size / 2, player.y + player.size / 2, true);
    lives--;
    playerPower = 0;
    if (lives <= 0) {
      over = true;
    } else {
      setTimeout(spawnPlayer, 900);
    }
  }

  function destroyBase() {
    map[ROWS - 1][6] = EMPTY;
    map[ROWS - 1][7] = EMPTY;
    explode(6 * TILE + TILE, (ROWS - 1) * TILE + TILE, true);
    shake = 12;
    over = true;
  }

  function dropPowerup(x, y) {
    const kinds = ["shield", "star", "bomb", "life", "shovel", "freeze"];
    const kind = kinds[(Math.random() * kinds.length) | 0];
    powerups.push({
      x: Math.floor(x / TILE) * TILE + 8,
      y: Math.floor(y / TILE) * TILE + 8,
      size: 32, kind,
    });
  }

  // ---------- 强化道具 ----------
  function applyPowerup(kind) {
    sfx.powerup();
    switch (kind) {
      case "shield": playerShieldUntil = gameTime + 10; break;
      case "star": playerPower = Math.min(3, playerPower + 1); break;
      case "bomb":
        enemies.forEach(e => { e.dead = true; score += e.type.points; explode(e.x + 20, e.y + 20, true); });
        enemies = enemies.filter(e => !e.dead);
        break;
      case "life": lives = Math.min(9, lives + 1); break;
      case "shovel":
        baseWallTimer = gameTime + 15;
        [[ROWS-2,6],[ROWS-2,7],[ROWS-1,5],[ROWS-1,8],[ROWS-3,5],[ROWS-3,6],[ROWS-3,7],[ROWS-3,8]]
          .forEach(([r,c]) => { if (map[r][c] === BRICK) map[r][c] = STEEL; });
        break;
      case "freeze":
        enemies.forEach(e => { e.frozenUntil = gameTime + 6; });
        break;
    }
  }

  function updatePowerups() {
    for (const p of powerups) {
      if (player && !player.dead && rectsOverlap(p, { x: player.x, y: player.y, size: player.size })) {
        p.dead = true;
        applyPowerup(p.kind);
      }
    }
    powerups = powerups.filter(p => !p.dead);
  }

  // ---------- 敌人 AI ----------
  function updateEnemies(dt) {
    for (const e of enemies) {
      if (e.dead) continue;
      if (e.frozenUntil && gameTime < e.frozenUntil) continue;

      if (e.spawnProtect > 0) e.spawnProtect -= dt;

      e.shootCooldown -= dt;
      e.moveTimer -= dt;

      if (e.moveTimer <= 0) {
        e.moveTimer = 0.5 + Math.random() * 1.5;
        // 一定概率朝下（进攻基地）
        const r = Math.random();
        if (r < 0.35) e.dir = DOWN;
        else if (r < 0.5) {
          const c = player ? (player.x + 20 - (e.x + 20)) : 0;
          const rr = player ? (player.y + 20 - (e.y + 20)) : 0;
          e.dir = Math.abs(c) > Math.abs(rr) ? (c > 0 ? RIGHT : LEFT) : (rr > 0 ? DOWN : UP);
        } else {
          e.dir = (Math.random() * 4) | 0;
        }
      }

      if (!moveTank(e, e.dir)) {
        e.moveTimer = 0;
      }

      // 射击
      if (e.shootCooldown <= 0) {
        const alignedWithBase = Math.abs(e.x - (6 * TILE + 4)) < TILE * 1.2 || Math.abs(e.x - (7 * TILE - 4)) < TILE * 1.2;
        if (alignedWithBase || Math.random() < 0.15) {
          if (alignedWithBase) {
            e.dir = (e.y + e.size < (ROWS - 2) * TILE) ? DOWN : UP;
          }
          fire(e);
        }
      }
    }
    enemies = enemies.filter(e => !e.dead);
  }

  function updateSpawns(dt) {
    if (enemiesToSpawn > 0 && enemies.length < MAX_ENEMIES_ON_SCREEN) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        if (spawnEnemy()) {
          enemiesToSpawn--;
          spawnTimer = 0.6;
        } else {
          spawnTimer = 0.2;
        }
      }
    }
    if (enemiesToSpawn <= 0 && enemies.length === 0 && !over && !boss) {
      won = true;
    }
  }

  // ---------- Boss ----------
  function spawnBoss() {
    boss = {
      x: 6 * TILE + (TILE - TANK_SIZE) / 2,
      y: 0,
      dir: DOWN,
      size: TANK_SIZE,
      speed: PLAYER_SPEED,
      hp: BOSS_HP,
      maxHp: BOSS_HP,
      color: "#c0392b",
      shootCooldown: 1.2,
      thinkTimer: 0,
      spawnProtect: 1.5,
      isBoss: true,
    };
  }

  function canStep(tank, dir) {
    return !tankBlocked(tank, tank.x + DX[dir] * tank.speed, tank.y + DY[dir] * tank.speed);
  }
  function stepInDir(tank, dir) {
    if (canStep(tank, dir)) {
      tank.x += DX[dir] * tank.speed;
      tank.y += DY[dir] * tank.speed;
      return true;
    }
    return false;
  }

  function bossDodge(b) {
    const bcx = b.x + b.size / 2, bcy = b.y + b.size / 2;
    let best = null, bestDist = 220;
    for (const bl of bullets) {
      if (!bl.isPlayer) continue;
      const dx = bcx - (bl.x + bl.size / 2);
      const dy = bcy - (bl.y + bl.size / 2);
      const dist = Math.hypot(dx, dy);
      if (dist > 220 || dist < 1) continue;
      const dot = DX[bl.dir] * dx + DY[bl.dir] * dy;
      if (dot > 0 && Math.abs(dot) / dist > 0.6) {
        if (dist < bestDist) { bestDist = dist; best = bl; }
      }
    }
    if (!best) return -1;
    const p1 = (best.dir + 1) % 4, p2 = (best.dir + 3) % 4;
    if (canStep(b, p1)) return p1;
    if (canStep(b, p2)) return p2;
    return -1;
  }

  function bossChase(b) {
    if (!player || player.dead) return b.dir;
    const px = player.x + player.size / 2, py = player.y + player.size / 2;
    const bx = b.x + b.size / 2, by = b.y + b.size / 2;
    const dx = px - bx, dy = py - by;
    const dist = Math.hypot(dx, dy);

    // 玩家炮口正对 Boss 且距离较近 → 横向埋伏，脱离玩家弹道
    const aligned =
      (player.dir === UP && dy < -20 && Math.abs(dx) < 50) ||
      (player.dir === DOWN && dy > 20 && Math.abs(dx) < 50) ||
      (player.dir === LEFT && dx < -20 && Math.abs(dy) < 50) ||
      (player.dir === RIGHT && dx > 20 && Math.abs(dy) < 50);
    if (aligned && dist < 340) {
      const side = Math.random() < 0.5 ? LEFT : RIGHT;
      if (canStep(b, side)) return side;
      if (canStep(b, side === LEFT ? RIGHT : LEFT)) return side === LEFT ? RIGHT : LEFT;
    }

    // 偶尔随机绕行，制造埋伏
    if (Math.random() < 0.12) return (Math.random() * 4) | 0;
    if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? RIGHT : LEFT;
    return dy > 0 ? DOWN : UP;
  }

  function aimAtPlayer(b) {
    if (!player || player.dead) return;
    const px = player.x + player.size / 2, py = player.y + player.size / 2;
    const bx = b.x + b.size / 2, by = b.y + b.size / 2;
    const dx = px - bx, dy = py - by;
    b.dir = (Math.abs(dx) > Math.abs(dy)) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);
  }

  function bossFire(b) {
    if (b.shootCooldown > 0) return;
    b.shootCooldown = PLAYER_FIRE_COOLDOWN; // 与玩家射速一致
    const m = (TANK_SIZE - BULLET_SIZE) / 2;
    const bx = b.x + m + (DX[b.dir] * (b.size / 2 - 2));
    const by = b.y + m + (DY[b.dir] * (b.size / 2 - 2));
    bullets.push(makeBullet(bx, by, b.dir, false, 0, BOSS_BULLET_SPEED));
    sfx.shoot();
  }

  function updateBoss(dt) {
    if (!boss || boss.dead) return;
    boss.shootCooldown -= dt;
    boss.thinkTimer -= dt;
    boss.spawnProtect = Math.max(0, boss.spawnProtect - dt);

    // 移动方向：闪避 > 追击/埋伏 > 保持
    let moveDir = boss.dir;
    const dodge = bossDodge(boss);
    if (dodge >= 0) {
      moveDir = dodge;
    } else if (boss.thinkTimer <= 0) {
      boss.thinkTimer = 0.25 + Math.random() * 0.5;
      moveDir = bossChase(boss);
    }
    if (!stepInDir(boss, moveDir)) {
      if (dodge < 0) boss.thinkTimer = 0; // 撞墙立即重新决策
    }

    // 始终面向玩家并射击
    aimAtPlayer(boss);
    bossFire(boss);
  }

  // ---------- 玩家 ----------
  function updatePlayer(dt) {
    if (!player || player.dead) return;
    player.shootCooldown -= dt;
    player.spawnProtect = Math.max(0, player.spawnProtect - dt);

    let dir = -1;
    if (keys.has("ArrowUp") || keys.has("KeyW")) dir = UP;
    else if (keys.has("ArrowDown") || keys.has("KeyS")) dir = DOWN;
    else if (keys.has("ArrowLeft") || keys.has("KeyA")) dir = LEFT;
    else if (keys.has("ArrowRight") || keys.has("KeyD")) dir = RIGHT;

    // 手柄方向（左摇杆 / 十字键，覆盖键盘）
    if (gp) {
      const gd = gamepadDir(gp);
      if (gd >= 0) dir = gd;
    }

    if (dir >= 0) moveTank(player, dir);

    const fireKey = keys.has("Space") || keys.has("KeyJ");
    const firePad = gp && (gp.buttons[0].pressed || gp.buttons[2].pressed || gp.buttons[5].pressed);
    if (fireKey || firePad) fire(player);
  }

  // ---------- 粒子 ----------
  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  // ---------- 主循环 ----------
  let last = 0;
  function loop(ts) {
    const dt = Math.min(0.05, (ts - last) / 1000 || 0);
    last = ts;
    gameTime += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 20);

    updateGamepad();

    if (!paused && !over && !won && !campaignClear) {
      updatePlayer(dt);
      updateBoss(dt);
      updateEnemies(dt);
      updateBullets(dt);
      updatePowerups();
      updateSpawns(dt);
      updateParticles(dt);
      campaignTime += dt;

      // 基地墙加固恢复
      if (baseWallTimer && gameTime > baseWallTimer) {
        baseWallTimer = 0;
        [[ROWS-2,6],[ROWS-2,7],[ROWS-1,5],[ROWS-1,8],[ROWS-3,5],[ROWS-3,6],[ROWS-3,7],[ROWS-3,8]]
          .forEach(([r,c]) => { if (map[r][c] === STEEL) map[r][c] = BRICK; });
      }
    }

    render();
    updateHUD();
    requestAnimationFrame(loop);
  }

  // ---------- 渲染 ----------
  function render() {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    // 背景
    ctx.fillStyle = "#11151f";
    ctx.fillRect(0, 0, W, H);

    // 网格地砖
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = map[r][c];
        const x = c * TILE, y = r * TILE;
        if (t === EMPTY) {
          ctx.fillStyle = (r + c) % 2 ? "#181d29" : "#141926";
          ctx.fillRect(x, y, TILE, TILE);
        } else if (t === BRICK) {
          drawBrick(x, y);
        } else if (t === STEEL) {
          drawSteel(x, y);
        } else if (t === WATER) {
          drawWater(x, y);
        } else if (t === BASE) {
          drawBaseTile(x, y);
        }
      }
    }

    // 草丛（最后画，覆盖坦克，半透明）
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (map[r][c] === GRASS) drawGrass(c * TILE, r * TILE);
      }
    }

    // 道具
    for (const p of powerups) drawPowerup(p);

    // 坦克
    if (player && !player.dead) drawTank(player);
    for (const e of enemies) if (!e.dead) drawTank(e);
    if (boss && !boss.dead) { drawTank(boss); drawBossBar(boss); }

    // 子弹
    for (const b of bullets) {
      ctx.fillStyle = b.isPlayer ? "#fff" : "#ffd24a";
      ctx.fillRect(b.x, b.y, b.size, b.size);
    }

    // 粒子
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    // 覆盖层
    if (paused && !over && !won && !campaignClear) overlay("已暂停", "按 P 继续", "#f5c542");
    if (over) overlay("游戏结束", "按 Enter 或 R 重新开始", "#ff5a5a");
    if (won) overlay("胜利！", "按 Enter 或 R 进入下一关", "#5ec46a");
  }

  function overlay(title, sub, color) {
    ctx.fillStyle = "rgba(6,8,14,0.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = color;
    ctx.font = "700 42px 'Segoe UI', 'Microsoft YaHei', sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 12);
    ctx.fillStyle = "#cbd3e2";
    ctx.font = "18px 'Segoe UI', 'Microsoft YaHei', sans-serif";
    ctx.fillText(sub, W / 2, H / 2 + 28);
  }

  function drawBrick(x, y) {
    ctx.fillStyle = "#a34a2a";
    ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = "#2c1208";
    ctx.lineWidth = 1.5;
    // 砖缝
    const half = TILE / 2;
    for (let row = 0; row < 2; row++) {
      const yy = y + row * half;
      for (let i = 0; i < 2; i++) {
        const xx = x + i * half + (row % 2 ? half / 2 : 0);
        if (xx < x + TILE) {
          ctx.strokeRect(xx, yy, half, half);
        }
      }
    }
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.strokeRect(x, y, TILE, TILE);
  }

  function drawSteel(x, y) {
    ctx.fillStyle = "#6f7a8c";
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = "#aeb8c8";
    ctx.fillRect(x + 3, y + 3, TILE - 6, TILE - 6);
    ctx.fillStyle = "#5a6575";
    ctx.fillRect(x + TILE / 2 - 2, y + 3, 4, TILE - 6);
    ctx.fillRect(x + 3, y + TILE / 2 - 2, TILE - 6, 4);
    ctx.strokeStyle = "#232a36";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x, y, TILE, TILE);
  }

  function drawWater(x, y) {
    const wave = Math.sin(gameTime * 3 + x * 0.1 + y * 0.1) * 2;
    ctx.fillStyle = "#1e4d7a";
    ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = "#3f7db8";
    ctx.lineWidth = 2;
    for (let i = 1; i < 3; i++) {
      ctx.beginPath();
      const yy = y + i * (TILE / 3) + wave;
      ctx.moveTo(x + 2, yy);
      ctx.quadraticCurveTo(x + TILE / 4, yy - 3, x + TILE / 2, yy);
      ctx.quadraticCurveTo(x + 3 * TILE / 4, yy + 3, x + TILE - 2, yy);
      ctx.stroke();
    }
  }

  function drawBaseTile(x, y) {
    // 基地底座
    ctx.fillStyle = "#1a1f2b";
    ctx.fillRect(x, y, TILE, TILE);
    // 鹰图标
    ctx.fillStyle = "#e8ecf4";
    ctx.beginPath();
    ctx.moveTo(x + TILE / 2, y + 8);
    ctx.lineTo(x + TILE - 8, y + TILE - 8);
    ctx.lineTo(x + TILE - 12, y + TILE - 8);
    ctx.lineTo(x + TILE - 8, y + TILE - 14);
    ctx.lineTo(x + TILE / 2 + 3, y + TILE / 2 - 4);
    ctx.lineTo(x + 8, y + TILE - 14);
    ctx.lineTo(x + 12, y + TILE - 8);
    ctx.lineTo(x + 8, y + TILE - 8);
    ctx.closePath();
    ctx.fill();
    // 基地文字
    ctx.fillStyle = "#8b96ad";
    ctx.font = "9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("基地", x + TILE / 2, y + TILE - 3);
  }

  function drawGrass(x, y) {
    ctx.fillStyle = "rgba(60,120,70,0.62)";
    ctx.fillRect(x, y, TILE, TILE);
    ctx.strokeStyle = "rgba(90,160,95,0.5)";
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const gx = x + 6 + i * 11;
      ctx.beginPath();
      ctx.moveTo(gx, y + TILE - 4);
      ctx.lineTo(gx + 2, y + TILE - 14);
      ctx.moveTo(gx + 4, y + TILE - 4);
      ctx.lineTo(gx + 5, y + TILE - 12);
      ctx.stroke();
    }
  }

  function drawTank(t) {
    ctx.save();
    ctx.translate(t.x + t.size / 2, t.y + t.size / 2);
    ctx.rotate(t.dir * Math.PI / 2);

    // 护盾光环
    if ((t.isPlayer && gameTime < playerShieldUntil) || t.spawnProtect > 0) {
      ctx.strokeStyle = t.spawnProtect > 0 && !t.isPlayer ? "rgba(255,255,255,0.5)" : "rgba(140,220,255,0.75)";
      ctx.lineWidth = 3;
      const blink = t.spawnProtect > 0 && Math.floor(t.spawnProtect * 6) % 2 === 0;
      if (!blink) ctx.strokeRect(-t.size / 2 - 3, -t.size / 2 - 3, t.size + 6, t.size + 6);
    }

    const s = t.size;
    // 履带
    ctx.fillStyle = "#2b2f38";
    ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.fillStyle = "#3a404c";
    for (let i = 0; i < 4; i++) {
      const o = -s / 2 + 5 + i * 9;
      ctx.fillRect(o, -s / 2 + 2, 4, s - 4);
    }
    // 车身
    ctx.fillStyle = t.color;
    ctx.fillRect(-s / 2 + 6, -s / 2 + 6, s - 12, s - 12);
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.fillRect(-s / 2 + 6, -s / 2 + 6, s - 12, 5);
    // 炮管
    ctx.fillStyle = "#22262e";
    ctx.fillRect(-3, -s / 2 - 8, 6, s / 2 - 2);
    // 炮塔
    ctx.fillStyle = t.isPlayer ? "#f7d94c" : shade(t.color, -12);
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.22, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawBossBar(b) {
    const w = b.size;
    const x = b.x, y = b.y - 14;
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(x - 2, y - 2, w + 4, 9);
    const ratio = Math.max(0, b.hp / b.maxHp);
    ctx.fillStyle = ratio > 0.5 ? "#5ec46a" : (ratio > 0.25 ? "#f5c542" : "#ff5a5a");
    ctx.fillRect(x, y, w * ratio, 5);
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 1;
    ctx.strokeRect(x - 2, y - 2, w + 4, 9);
  }

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) + amt, g = ((n >> 8) & 0xff) + amt, b = (n & 0xff) + amt;
    r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
    return `rgb(${r},${g},${b})`;
  }

  function drawPowerup(p) {
    const c = {
      shield: "#4fc3f7", star: "#f5c542", bomb: "#ff6b6b",
      life: "#5ec46a", shovel: "#c9a15a", freeze: "#b39ddb",
    }[p.kind];
    ctx.save();
    ctx.translate(p.x + p.size / 2, p.y + p.size / 2);
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fillRect(-p.size / 2 - 2, -p.size / 2 - 2, p.size + 4, p.size + 4);
    ctx.fillStyle = c;
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const sym = { shield: "盾", star: "★", bomb: "炸", life: "命", shovel: "铲", freeze: "冰" }[p.kind];
    ctx.fillText(sym, 0, 1);
    ctx.restore();
    ctx.textBaseline = "alphabetic";
  }

  // ---------- HUD ----------
  function updateHUD() {
    document.getElementById("score").textContent = score;
    const levelEl = document.getElementById("level");
    if (mode === 'infinite') levelEl.textContent = "∞";
    else if (level === 5) levelEl.textContent = "5 · BOSS";
    else levelEl.textContent = level;
    document.getElementById("enemiesLeft").textContent = (level === 5) ? "BOSS" : (enemiesToSpawn + enemies.length);
    document.getElementById("clearCount").textContent = clearCount;
    document.getElementById("bestTime").textContent = isFinite(bestTime) ? formatTime(bestTime) : "--";

    const livesEl = document.getElementById("lives");
    livesEl.innerHTML = "";
    for (let i = 0; i < Math.min(6, lives); i++) {
      const d = document.createElement("div");
      d.className = "life";
      livesEl.appendChild(d);
    }

    const padEl = document.getElementById("padStatus");
    if (padEl) {
      if (gamepadConnected) {
        padEl.textContent = "🎮 Xbox 手柄：已连接";
        padEl.style.color = "#5ec46a";
      } else {
        padEl.textContent = "🎮 Xbox 手柄：未连接";
        padEl.style.color = "#8b96ad";
      }
    }
  }

  // ---------- 输入 ----------
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") e.preventDefault();
    if (e.code === "KeyP" && !e.repeat) { if (!over && !won && !campaignClear) paused = !paused; return; }
    if (e.code === "KeyM" && !e.repeat) { muted = !muted; return; }
    keys.add(e.code);
  });
  window.addEventListener("keyup", (e) => keys.delete(e.code));
  window.addEventListener("blur", () => keys.clear());

  // 触屏按钮（简单虚拟摇杆）
  const touch = { dir: -1, fire: false };
  function bindTouch(id, dir, fire) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("touchstart", (e) => { e.preventDefault(); if (fire) touch.fire = true; else touch.dir = dir; });
    el.addEventListener("touchend", (e) => { e.preventDefault(); if (fire) touch.fire = false; else if (touch.dir === dir) touch.dir = -1; });
  }

  // ---------- 游戏流程 ----------
  function startGame(lv = 1) {
    level = lv;
    mode = 'campaign';
    difficultyLevel = lv;
    score = 0;
    lives = START_LIVES;
    campaignTime = 0;
    campaignClear = false;
    hideChoicePanel();
    map = buildMap(lv);
    resetRound();
  }

  function nextLevel() {
    level++;
    lives = START_LIVES;           // 每关完成血量恢复
    difficultyLevel = (mode === 'infinite') ? 4 : Math.min(level, 4);
    map = buildMap(level);
    resetRound();
  }

  function resetRound() {
    enemies = [];
    bullets = [];
    particles = [];
    powerups = [];
    boss = null;
    over = false;
    won = false;
    campaignClear = false;
    paused = false;
    baseWallTimer = 0;
    gameTime = 0;
    spawnPlayer();
    if (level === 5) {
      enemiesToSpawn = 0;
      spawnTimer = 0;
      spawnBoss();
    } else {
      enemiesToSpawn = ENEMIES_PER_LEVEL;
      spawnTimer = 0.5;
    }
  }

  function onCampaignClear() {
    if (campaignClear) return;
    campaignClear = true;
    over = false;
    won = false;
    clearCount++;
    if (!isFinite(bestTime) || campaignTime < bestTime) bestTime = campaignTime;
    saveStats();
    showChoicePanel();
  }

  function enterInfiniteMode() {
    campaignClear = false;
    hideChoicePanel();
    mode = 'infinite';
    level++;
    difficultyLevel = 4;
    lives = START_LIVES;
    map = buildMap();
    resetRound();
  }

  function returnToStart() {
    hideChoicePanel();
    startGame(1);
  }

  function showChoicePanel() {
    const el = document.getElementById("choicePanel");
    const statsEl = document.getElementById("choiceStats");
    if (statsEl) {
      statsEl.textContent = "本次通关用时 " + formatTime(campaignTime) +
        "，累计通关 " + clearCount + " 次，最短 " + formatTime(bestTime);
    }
    if (el) el.style.display = "flex";
  }
  function hideChoicePanel() {
    const el = document.getElementById("choicePanel");
    if (el) el.style.display = "none";
  }

  document.getElementById("restart").addEventListener("click", () => startGame(1));
  document.getElementById("btnInfinite").addEventListener("click", enterInfiniteMode);
  document.getElementById("btnRestart").addEventListener("click", returnToStart);

  // 键盘重启 / 下一关
  window.addEventListener("keydown", (e) => {
    if (campaignClear) {
      if (e.code === "Enter") enterInfiniteMode();
      else if (e.code === "KeyR") returnToStart();
      return;
    }
    if ((e.code === "Enter" || e.code === "KeyR") && (over || won)) {
      if (won) nextLevel(); else startGame(1);
    }
  });

  // ---------- 启动 ----------
  loadStats();
  startGame(1);
  requestAnimationFrame((ts) => { last = ts; loop(ts); });
})();
</script>
</body>
</html>
